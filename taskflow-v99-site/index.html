<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050914">
<title>TaskFlow</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050914;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh}.boot{min-height:100dvh;display:grid;place-items:center;padding:28px 22px;background:radial-gradient(circle at 25% 20%,rgba(44,225,208,.10),transparent 33%),radial-gradient(circle at 78% 74%,rgba(255,126,37,.09),transparent 32%),#050914}.card{width:min(430px,100%);text-align:center}.mark{width:72px;height:72px;margin:0 auto 18px;border-radius:22px;display:grid;place-items:center;border:1px solid rgba(74,229,215,.28);background:linear-gradient(145deg,rgba(13,52,63,.95),rgba(12,17,35,.98));box-shadow:0 20px 50px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.03)}.mark svg{width:38px;height:38px;color:#4be3d4}.logo{font-size:34px;line-height:1;font-weight:900;letter-spacing:-1.2px;background:linear-gradient(90deg,#42e1d1 0%,#55d6c8 48%,#ff8a2b 100%);-webkit-background-clip:text;background-clip:text;color:transparent}.version{margin-top:8px;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#8191ad}.msg{margin-top:19px;color:#a7b2c5;font-size:14px;line-height:1.5}.bar{height:5px;border-radius:999px;background:#111a2b;overflow:hidden;margin:24px auto 0;max-width:310px}.bar>i{display:block;height:100%;width:40%;border-radius:inherit;background:linear-gradient(90deg,#40dfd0,#ff8a2b);animation:move .9s ease-in-out infinite alternate}@keyframes move{from{transform:translateX(-15%)}to{transform:translateX(165%)}}.retry{display:none;margin:20px auto 0;border:1px solid rgba(75,226,212,.3);border-radius:14px;padding:12px 18px;background:#12323a;color:#55e1d3;font-weight:850;font-size:14px;cursor:pointer}.error .bar{display:none}.error .retry{display:inline-flex}.fine{margin-top:14px;font-size:10px;color:#5f6c83}
</style>
</head>
<body>
<div class="boot" id="boot"><div class="card">
  <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6h14v12H5z"/><path d="M8 9h8M8 13h5"/><path d="m16 16 1.5 1.5L20 15"/></svg></div>
  <div class="logo">TaskFlow</div>
  <div class="version">V99 · inicio seguro</div>
  <div class="msg" id="msg">Preparando el sistema…</div>
  <div class="bar"><i></i></div>
  <button class="retry" id="retry" type="button">Reintentar</button>
  <div class="fine">Carga cifrada por HTTPS · integridad verificada antes de iniciar</div>
</div></div>
<script>
(()=>{
  'use strict';
  const bootEl=document.getElementById('boot');
  const msgEl=document.getElementById('msg');
  const retryEl=document.getElementById('retry');
  const ref='23bd0a4879eb335d597116e13fc781ddd5e309c5';
  const base='https://raw.githubusercontent.com/novaprimegt-coder/gestion-tareas/'+ref+'/taskflow-v99-deploy/';
  const parts=['p0.txt','p1.txt','p2.txt','q0.txt','q1.txt','q2.txt','q3.txt','q4.txt','q5.txt','q6.txt','q7.txt','q8.txt','q9.txt','q10.txt','q11.txt','q12.txt','q13.txt'];
  const expectedLength=190428;
  const expectedHash='a27010f2bf333398e0cbf31f5ab5c3a1df95ead3512e243e18dbbf60f0324e9c';
  const hex=buf=>Array.from(new Uint8Array(buf),b=>b.toString(16).padStart(2,'0')).join('');
  async function boot(){
    bootEl.classList.remove('error'); retryEl.disabled=true; msgEl.textContent='Descargando TaskFlow…';
    try{
      const responses=await Promise.all(parts.map(async(name)=>{
        const response=await fetch(base+name,{cache:'force-cache',mode:'cors'});
        if(!response.ok) throw new Error('No se pudo obtener '+name+' ('+response.status+')');
        return (await response.text()).trim();
      }));
      const payload=responses.join('');
      if(payload.length!==expectedLength) throw new Error('El paquete está incompleto.');
      msgEl.textContent='Verificando integridad…';
      if(!globalThis.crypto?.subtle) throw new Error('Este navegador no permite verificación segura.');
      const digest=hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(payload)));
      if(digest!==expectedHash) throw new Error('La verificación de integridad falló.');
      if(typeof DecompressionStream!=='function') throw new Error('Tu navegador es demasiado antiguo para iniciar TaskFlow. Actualiza Chrome.');
      msgEl.textContent='Iniciando TaskFlow…';
      const bin=atob(payload);
      const bytes=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      const html=await new Response(stream).text();
      if(!html.includes('<html')||!html.includes('TaskFlow')) throw new Error('El contenido reconstruido no es válido.');
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      console.error('TaskFlow boot error:',error);
      bootEl.classList.add('error');
      msgEl.textContent='No se pudo iniciar TaskFlow. Comprueba tu conexión y vuelve a intentarlo.';
      retryEl.disabled=false;
    }
  }
  retryEl.addEventListener('click',boot);
  boot();
})();
</script>
</body>
</html>
