<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030812">
<title>NovaPrime GT · Iniciando</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030812;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100dvh}.boot{min-height:100dvh;display:grid;place-items:center;padding:28px 20px;background:radial-gradient(circle at 20% 10%,rgba(0,215,255,.12),transparent 34%),radial-gradient(circle at 80% 85%,rgba(123,108,255,.10),transparent 30%),#030812}.card{width:min(440px,100%);text-align:center}.mark{width:76px;height:76px;margin:0 auto 18px;border-radius:23px;display:grid;place-items:center;border:1px solid rgba(0,215,255,.28);background:linear-gradient(145deg,rgba(7,35,55,.96),rgba(7,16,30,.99));box-shadow:0 22px 55px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.03)}.mark svg{width:40px;height:40px;color:#00d7ff}.logo{font-size:32px;line-height:1;font-weight:950;letter-spacing:-1.2px;background:linear-gradient(90deg,#00e6ff,#3ebcff 55%,#8a79ff);-webkit-background-clip:text;background-clip:text;color:transparent}.version{margin-top:9px;font-size:11px;font-weight:850;letter-spacing:.17em;text-transform:uppercase;color:#8095b5}.msg{margin-top:20px;color:#b8c8de;font-size:14px;line-height:1.5}.bar{height:5px;border-radius:999px;background:#0b1728;overflow:hidden;margin:24px auto 0;max-width:310px}.bar>i{display:block;height:100%;width:42%;border-radius:inherit;background:linear-gradient(90deg,#00e2ff,#568cff);animation:move .9s ease-in-out infinite alternate}@keyframes move{from{transform:translateX(-18%)}to{transform:translateX(160%)}}.retry{display:none;margin:20px auto 0;border:1px solid rgba(0,215,255,.32);border-radius:14px;padding:12px 18px;background:#0a2635;color:#72eaff;font-weight:850;font-size:14px;cursor:pointer}.error .bar{display:none}.error .retry{display:inline-flex}.detail{display:none;margin:12px auto 0;max-width:390px;color:#7f91ad;font-size:10px;line-height:1.5;word-break:break-word}.error .detail{display:block}.fine{margin-top:14px;font-size:10px;color:#5e708d}
</style>
</head>
<body>
<div class="boot" id="boot"><div class="card">
  <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16v10H4z"/><path d="M7 10h5M7 13h8"/><circle cx="18" cy="5" r="2"/></svg></div>
  <div class="logo">NovaPrime GT</div>
  <div class="version" id="version">v11.24 · carga verificada</div>
  <div class="msg" id="msg">Preparando la tienda…</div>
  <div class="bar"><i></i></div>
  <button class="retry" id="retry" type="button">Reintentar</button>
  <div class="detail" id="detail"></div>
  <div class="fine">GitHub Pages · HTTPS · integridad SHA-256</div>
</div></div>
<script>
(()=>{
  'use strict';

  const bootEl=document.getElementById('boot');
  const msgEl=document.getElementById('msg');
  const detailEl=document.getElementById('detail');
  const retryEl=document.getElementById('retry');
  const versionEl=document.getElementById('version');
  const owner='novaprimegt-coder';
  const repo='gestion-tareas';

  const fallbackRelease={
    schema:1,
    app:'NovaPrime GT',
    version:'11.24',
    ref:'3ac4e828e59ad126181652dde5c2bf762ac40c6a',
    partsBase:'novaprime-gt-app/public/releases/v11.24/parts19',
    parts:Array.from({length:29},(_,i)=>'p'+String(i).padStart(2,'0')+'.txt'),
    partBytes:[...Array(28).fill(19000),18452],
    base64Bytes:550452,
    gzipBytes:412839,
    gzipSha256:'22b2c1ee90f891a5d257662728cc9ba5dcb1f41fb756bb38d1c6651381e8fdb4',
    htmlBytes:1351125,
    htmlSha256:'71c7f0e7faa1ae682cb59615b5e09e7671b67ccfc736eaffaddbeb4bf0933d03'
  };

  const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
  const decodeMap=new Int16Array(128);
  decodeMap.fill(-1);
  for(let i=0;i<alphabet.length;i++) decodeMap[alphabet.charCodeAt(i)]=i;

  function base64Value(code){
    return code>=0&&code<128?decodeMap[code]:-1;
  }

  function decodeBase64Strict(input){
    const s=String(input||'').replace(/\s+/g,'');
    if(!s||s.length%4!==0) throw new Error('El paquete codificado tiene una longitud inválida.');
    if(!/^[A-Za-z0-9+/]*={0,2}$/.test(s)) throw new Error('El paquete contiene caracteres inválidos.');

    const firstPad=s.indexOf('=');
    if(firstPad!==-1&&firstPad<s.length-2) throw new Error('El relleno del paquete es inválido.');

    const padding=s.endsWith('==')?2:(s.endsWith('=')?1:0);
    const outLength=(s.length/4)*3-padding;
    const out=new Uint8Array(outLength);
    let o=0;

    for(let i=0;i<s.length;i+=4){
      const a=base64Value(s.charCodeAt(i));
      const b=base64Value(s.charCodeAt(i+1));
      const cCode=s.charCodeAt(i+2);
      const dCode=s.charCodeAt(i+3);
      const c=cCode===61?0:base64Value(cCode);
      const d=dCode===61?0:base64Value(dCode);
      if(a<0||b<0||c<0||d<0) throw new Error('No se pudo decodificar el paquete verificado.');

      const n=(a<<18)|(b<<12)|(c<<6)|d;
      if(o<outLength) out[o++]=(n>>>16)&255;
      if(o<outLength) out[o++]=(n>>>8)&255;
      if(o<outLength) out[o++]=n&255;
    }

    if(o!==outLength) throw new Error('La decodificación quedó incompleta.');
    return out;
  }

  function isHex(value,length){
    return typeof value==='string'&&value.length===length&&/^[0-9a-f]+$/i.test(value);
  }

  function validateRelease(r){
    if(!r||r.schema!==1||r.app!=='NovaPrime GT') throw new Error('El manifiesto de NovaPrime GT no es válido.');
    if(typeof r.version!=='string'||!r.version) throw new Error('El manifiesto no contiene versión.');
    if(!isHex(r.ref,40)) throw new Error('La referencia de versión no es válida.');
    if(typeof r.partsBase!=='string'||!r.partsBase||r.partsBase.includes('..')||!/^[A-Za-z0-9._/-]+$/.test(r.partsBase)) throw new Error('La ruta del release no es válida.');
    if(!Array.isArray(r.parts)||r.parts.length!==29) throw new Error('El release no contiene los 29 fragmentos requeridos.');
    if(!Array.isArray(r.partBytes)||r.partBytes.length!==r.parts.length) throw new Error('El manifiesto de tamaños está incompleto.');
    if(!r.parts.every((name,i)=>/^p\d{2}\.txt$/.test(name)&&Number.isInteger(r.partBytes[i])&&r.partBytes[i]>0)) throw new Error('La lista de fragmentos no es válida.');
    if(!Number.isInteger(r.base64Bytes)||r.base64Bytes<=0||!Number.isInteger(r.gzipBytes)||r.gzipBytes<=0||!Number.isInteger(r.htmlBytes)||r.htmlBytes<=0) throw new Error('Los tamaños del release no son válidos.');
    if(!isHex(r.gzipSha256,64)||!isHex(r.htmlSha256,64)) throw new Error('Los hashes del release no son válidos.');
    return r;
  }

  async function sha256Hex(data){
    const digest=await crypto.subtle.digest('SHA-256',data);
    return Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('');
  }

  async function getRelease(){
    const manifest='https://raw.githubusercontent.com/'+owner+'/'+repo+'/main/novaprime-gt-app/public/release.json?v='+Date.now();
    try{
      const response=await fetch(manifest,{cache:'no-store',mode:'cors'});
      if(!response.ok) throw new Error('HTTP '+response.status);
      return validateRelease(await response.json());
    }catch(error){
      console.warn('No se pudo leer el manifiesto remoto; se usa el release estable incorporado.',error);
      return validateRelease({...fallbackRelease});
    }
  }

  async function fetchPart(release,index){
    const name=release.parts[index];
    const url='https://raw.githubusercontent.com/'+owner+'/'+repo+'/'+release.ref+'/'+release.partsBase+'/'+name+'?v='+release.ref.slice(0,12);
    const response=await fetch(url,{cache:'no-store',mode:'cors'});
    if(!response.ok) throw new Error('No se pudo obtener '+name+' (HTTP '+response.status+').');
    const text=(await response.text()).replace(/\s+/g,'');
    if(text.length!==release.partBytes[index]) throw new Error(name+' está incompleto: '+text.length+' / '+release.partBytes[index]+' bytes.');
    return text;
  }

  async function boot(){
    bootEl.classList.remove('error');
    retryEl.disabled=true;
    detailEl.textContent='';
    msgEl.textContent='Leyendo versión estable…';

    try{
      if(typeof DecompressionStream!=='function') throw new Error('Este navegador no dispone de descompresión GZIP nativa. Actualiza Chrome o Android System WebView.');
      if(!globalThis.crypto||!crypto.subtle) throw new Error('SHA-256 no está disponible en este navegador.');

      const release=await getRelease();
      versionEl.textContent='v'+release.version+' · carga verificada';
      const chunks=new Array(release.parts.length);
      const batchSize=6;

      for(let start=0;start<release.parts.length;start+=batchSize){
        const end=Math.min(start+batchSize,release.parts.length);
        msgEl.textContent='Descargando NovaPrime GT… '+start+'/'+release.parts.length;
        const batch=[];
        for(let i=start;i<end;i++) batch.push(fetchPart(release,i));
        const values=await Promise.all(batch);
        for(let i=0;i<values.length;i++) chunks[start+i]=values[i];
      }

      msgEl.textContent='Reconstruyendo paquete…';
      const payload=chunks.join('');
      if(payload.length!==release.base64Bytes) throw new Error('Paquete incompleto: '+payload.length+' / '+release.base64Bytes+' bytes.');

      const compressed=decodeBase64Strict(payload);
      if(compressed.byteLength!==release.gzipBytes) throw new Error('GZIP incompleto: '+compressed.byteLength+' / '+release.gzipBytes+' bytes.');

      msgEl.textContent='Verificando paquete…';
      const gzipDigest=await sha256Hex(compressed);
      if(gzipDigest.toLowerCase()!==release.gzipSha256.toLowerCase()) throw new Error('La verificación SHA-256 del paquete no coincide.');

      msgEl.textContent='Descomprimiendo NovaPrime GT…';
      const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
      const htmlBuffer=await new Response(stream).arrayBuffer();
      if(htmlBuffer.byteLength!==release.htmlBytes) throw new Error('HTML incompleto: '+htmlBuffer.byteLength+' / '+release.htmlBytes+' bytes.');

      msgEl.textContent='Verificando sistema…';
      const htmlDigest=await sha256Hex(htmlBuffer);
      if(htmlDigest.toLowerCase()!==release.htmlSha256.toLowerCase()) throw new Error('La verificación SHA-256 del sistema no coincide.');

      const html=new TextDecoder('utf-8',{fatal:true}).decode(htmlBuffer);
      if(!/^\s*<!doctype html>/i.test(html)||!html.includes('NovaPrime GT')||!/<\/html>\s*$/i.test(html)) throw new Error('El HTML reconstruido no superó la validación final.');

      msgEl.textContent='Iniciando NovaPrime GT…';
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      console.error('NovaPrime GT boot error:',error);
      bootEl.classList.add('error');
      msgEl.textContent='No se pudo iniciar NovaPrime GT. Toca Reintentar.';
      detailEl.textContent=String(error&&error.message?error.message:error);
      retryEl.disabled=false;
    }
  }

  retryEl.addEventListener('click',boot);
  boot();
})();
</script>
</body>
</html>
