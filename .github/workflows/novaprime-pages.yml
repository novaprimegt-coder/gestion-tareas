name: Deploy NovaPrime GT v11.24 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'novaprime-gt-v11-24/**'
      - '.github/workflows/novaprime-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: novaprime-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild NovaPrime GT index.html
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          source = Path('novaprime-gt-v11-24')
          parts = sorted(source.glob('p*.txt'))
          if not parts:
              raise SystemExit('No se encontraron fragmentos p*.txt')

          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          try:
              compressed = base64.b64decode(encoded, validate=True)
              html = gzip.decompress(compressed)
          except Exception as exc:
              raise SystemExit(f'No se pudo reconstruir el HTML: {exc}')

          if b'<!DOCTYPE html>' not in html[:200] and b'<!doctype html>' not in html[:200].lower():
              raise SystemExit('El archivo reconstruido no parece ser HTML válido')
          if b'</html>' not in html[-500:].lower():
              raise SystemExit('El HTML reconstruido parece incompleto')

          output = Path('_site/index.html')
          output.write_bytes(html)
          print(f'Partes: {len(parts)}')
          print(f'Tamaño final: {len(html)} bytes')
          print(f'SHA256: {hashlib.sha256(html).hexdigest()}')
          PY

      - name: Disable Jekyll processing
        run: touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
