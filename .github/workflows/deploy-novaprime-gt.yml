name: Deploy NovaPrime GT

on:
  push:
    branches:
      - main
    paths:
      - "novaprime-gt-app/public/releases/v11.24/**"
      - ".github/workflows/deploy-novaprime-gt.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-novaprime-gt
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          path: src
          fetch-depth: 1

      - name: Checkout GitHub Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 1

      - name: Rebuild and verify NovaPrime GT v11.24
        shell: bash
        run: |
          set -euo pipefail

          SRC="$GITHUB_WORKSPACE/src/novaprime-gt-app/public/releases/v11.24/parts19"
          DEST="$GITHUB_WORKSPACE/site/novaprime-gt"
          B64="$(mktemp)"
          GZ="$(mktemp)"
          HTML="$(mktemp)"

          test -d "$SRC"
          mkdir -p "$DEST"

          for n in $(seq -w 0 28); do
            test -f "$SRC/p${n}.txt"
          done

          cat "$SRC"/p{00..28}.txt > "$B64"

          B64_BYTES="$(wc -c < "$B64" | tr -d ' ')"
          test "$B64_BYTES" = "550452"

          base64 --decode "$B64" > "$GZ"
          GZ_BYTES="$(wc -c < "$GZ" | tr -d ' ')"
          test "$GZ_BYTES" = "412839"
          printf '%s  %s\n' '22b2c1ee90f891a5d257662728cc9ba5dcb1f41fb756bb38d1c6651381e8fdb4' "$GZ" | sha256sum -c -

          gzip -dc "$GZ" > "$HTML"
          HTML_BYTES="$(wc -c < "$HTML" | tr -d ' ')"
          test "$HTML_BYTES" = "1351125"
          printf '%s  %s\n' '71c7f0e7faa1ae682cb59615b5e09e7671b67ccfc736eaffaddbeb4bf0933d03' "$HTML" | sha256sum -c -

          grep -qi '<!doctype html' "$HTML"
          grep -q 'NovaPrime GT' "$HTML"
          grep -qi '</html>' "$HTML"

          cp "$HTML" "$DEST/index.html"

          cat > "$DEST/deployment.json" <<'JSON'
          {
            "app": "NovaPrime GT",
            "version": "11.24",
            "delivery": "direct-html",
            "htmlBytes": 1351125,
            "htmlSha256": "71c7f0e7faa1ae682cb59615b5e09e7671b67ccfc736eaffaddbeb4bf0933d03",
            "gzipBytes": 412839,
            "gzipSha256": "22b2c1ee90f891a5d257662728cc9ba5dcb1f41fb756bb38d1c6651381e8fdb4"
          }
          JSON

          touch "$GITHUB_WORKSPACE/site/.nojekyll"

      - name: Publish only NovaPrime GT
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/site"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nojekyll novaprime-gt/index.html novaprime-gt/deployment.json

          if git diff --cached --quiet; then
            echo "NovaPrime GT is already up to date."
            exit 0
          fi

          git commit -m "Deploy NovaPrime GT v11.24 direct HTML"
          git push origin HEAD:gh-pages
