name: Deploy TaskFlow V99 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'taskflow-v99-site/**'
      - '.github/workflows/taskflow-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload TaskFlow site
        uses: actions/upload-pages-artifact@v4
        with:
          path: './taskflow-v99-site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
