<!doctype html>

<title>TaskFlow</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050914;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh}.boot{min-height:100dvh;display:grid;place-items:center;padding:28px 22px;background:radial-gradient(circle at 25% 20%,rgba(44,225,208,.10),transparent 33%),radial-gradient(circle at 78% 74%,rgba(255,126,37,.09),transparent 32%),#050914}.card{width:min(430px,100%);text-align:center}.mark{width:72px;height:72px;margin:0 auto 18px;border-radius:22px;display:grid;place-items:center;border:1px solid rgba(74,229,215,.28);background:linear-gradient(145deg,rgba(13,52,63,.95),rgba(12,17,35,.98));box-shadow:0 20px 50px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.03)}.mark svg{width:38px;height:38px;color:#4be3d4}.logo{font-size:34px;line-height:1;font-weight:900;letter-spacing:-1.2px;background:linear-gradient(90deg,#42e1d1 0%,#55d6c8 48%,#ff8a2b 100%);-webkit-background-clip:text;background-clip:text;color:transparent}.version{margin-top:8px;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#8191ad}.msg{margin-top:19px;color:#a7b2c5;font-size:14px;line-height:1.5}.bar{height:5px;border-radius:999px;background:#111a2b;overflow:hidden;margin:24px auto 0;max-width:310px}.bar>i{display:block;height:100%;width:40%;border-radius:inherit;background:linear-gradient(90deg,#40dfd0,#ff8a2b);animation:move .9s ease-in-out infinite alternate}@keyframes move{from{transform:translateX(-15%)}to{transform:translateX(165%)}}.retry{display:none;margin:20px auto 0;border:1px solid rgba(75,226,212,.3);border-radius:14px;padding:12px 18px;background:#12323a;color:#55e1d3;font-weight:850;font-size:14px;cursor:pointer}.error .bar{display:none}.error .retry{display:inline-flex}.fine{margin-top:14px;font-size:10px;color:#5f6c83}.detail{display:none;margin:12px auto 0;max-width:370px;color:#75849d;font-size:10px;line-height:1.45;word-break:break-word}.error .detail{display:block}
</style>
</head>
<body>
<div class="boot" id="boot"><div class="card">
  <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6h14v12H5z"/><path d="M8 9h8M8 13h5"/><path d="m16 16 1.5 1.5L20 15"/></svg></div>
  <div class="logo">TaskFlow</div>
  <div class="version">V101 · desplazamiento estable</div>
  <div class="msg" id="msg">Preparando el sistema…</div>
  <div class="bar"><i></i></div>
  <button class="retry" id="retry" type="button">Reintentar</button>
  <div class="detail" id="detail"></div>
  <div class="fine">Carga segura por HTTPS · TaskFlow</div>
</div></div>
<script>
(()=>{
  'use strict';
  const bootEl=document.getElementById('boot');
  const msgEl=document.getElementById('msg');
  const detailEl=document.getElementById('detail');
  const retryEl=document.getElementById('retry');
  const ref='23bd0a4879eb335d597116e13fc781ddd5e309c5';
  const base='https://raw.githubusercontent.com/novaprimegt-coder/gestion-tareas/'+ref+'/taskflow-v99-deploy/';
  const parts=['p0.txt','p1.txt','p2.txt','q0.txt','q1.txt','q2.txt','q3.txt','q4.txt','q5.txt','q6.txt','q7.txt','q8.txt','q9.txt','q10.txt','q11.txt','q12.txt','q13.txt'];
  const expectedLength=190428;
  const expectedHash='f4fc8e589bb9ac8f6ecb1bf2d8c071c1463f720ba66d82296055914ec67cab50';
  const hex=buf=>Array.from(new Uint8Array(buf),b=>b.toString(16).padStart(2,'0')).join('');
  const noAdsButton=`<a class="quick-action-btn" id="btnNoAds" href="http://action_noads" aria-label="Eliminar anuncios" role="button">
      <span class="quick-action-icon noads" aria-hidden="true">
        <svg class="tf-ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="3"/>
          <path d="M7 15V9l2.2 6V9"/>
          <path d="M13 9v6h1.7c1.8 0 3.3-1.3 3.3-3s-1.5-3-3.3-3H13Z"/>
          <path d="M4 4l16 16"/>
        </svg>
      </span>
      <span>Eliminar anuncios</span>
    </a>`;
  const injectedStyle=`<style id="tf-v101-actions-scroll">
/* V101 · Menú y desplazamiento vertical reforzado para navegador y Android WebView. */
.tf-v91-actions-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}
.tf-v91-actions-grid .quick-action-btn{width:100%!important;max-width:none!important;text-decoration:none!important}
.tf-v91-actions-grid .quick-action-icon.noads{color:#ff9b5a!important;background:rgba(255,138,43,.12)!important;border:1px solid rgba(255,138,43,.24)!important}
html,body,.wrap{touch-action:pan-y!important;overscroll-behavior-y:auto!important}
html{overflow-x:hidden!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch!important}
body{overflow-x:hidden!important;overflow-y:visible!important;min-height:100%!important}
.wrap{height:auto!important;min-height:100%!important;overflow:visible!important;padding-bottom:max(118px,calc(34px + env(safe-area-inset-bottom)))!important}
.window-container.open:not(.rank-modal):not(.mentalist-modal){
  position:fixed!important;inset:0!important;width:100%!important;height:100vh!important;height:100dvh!important;max-height:100dvh!important;
  overflow-x:hidden!important;overflow-y:scroll!important;-webkit-overflow-scrolling:touch!important;
  overscroll-behavior-x:none!important;overscroll-behavior-y:contain!important;touch-action:pan-y!important;scroll-behavior:auto!important;
  padding-bottom:max(96px,calc(22px + env(safe-area-inset-bottom)))!important;box-sizing:border-box!important;
}
.window-container.open:not(.rank-modal):not(.mentalist-modal)>.window-content{
  height:auto!important;min-height:0!important;max-height:none!important;overflow:visible!important;overflow-x:hidden!important;
  touch-action:pan-y!important;overscroll-behavior-y:auto!important;
  margin-top:8px!important;margin-bottom:max(118px,calc(34px + env(safe-area-inset-bottom)))!important;
}
.window-container.open:not(.rank-modal):not(.mentalist-modal)>.window-content *{overscroll-behavior-y:auto}
.window-container.store-modal.open{overflow-y:scroll!important;padding-bottom:max(96px,calc(22px + env(safe-area-inset-bottom)))!important}
.window-container.store-modal.open .window-content.store-mode.v79-store-mode{margin-bottom:max(118px,calc(34px + env(safe-area-inset-bottom)))!important}
.side-menu.open,.policy-page.open{overflow-y:scroll!important;-webkit-overflow-scrolling:touch!important;touch-action:pan-y!important;overscroll-behavior-y:contain!important;padding-bottom:max(106px,calc(30px + env(safe-area-inset-bottom)))!important}
.rank-scroll-area,.v96-mentalist-scroll,.v97-routine-scroll,.tf-icon-catalog-body{
  overflow-x:hidden!important;overflow-y:scroll!important;-webkit-overflow-scrolling:touch!important;touch-action:pan-y!important;
  overscroll-behavior-y:contain!important;scroll-behavior:auto!important;
}
/* Catálogo de iconos: el cuerpo es el dueño físico del scroll. */
.tf-icon-sheet{
  position:fixed!important;top:max(50px,env(safe-area-inset-top))!important;right:7px!important;left:7px!important;
  bottom:max(94px,calc(70px + env(safe-area-inset-bottom)))!important;height:auto!important;max-height:none!important;
  grid-template-rows:auto auto auto minmax(0,1fr)!important;align-content:stretch!important;overflow:hidden!important;touch-action:pan-y!important;
}
.tf-icon-catalog-body{
  min-height:0!important;height:auto!important;max-height:none!important;padding:2px 2px max(34px,env(safe-area-inset-bottom))!important;
  scroll-padding-bottom:36px!important;scrollbar-gutter:stable!important;
}
.tf-icon-groups,.tf-icon-group,.tf-icon-grid{min-height:min-content!important;align-content:start!important}
.tf-icon-option,.tf-icon-option *{touch-action:pan-y!important}
.tf-icon-option-mark,.tf-icon-option-mark svg{overflow:visible!important}
.tf-icon-option-mark svg{display:block!important;width:100%!important;height:100%!important;max-width:22px!important;max-height:22px!important;margin:auto!important}
@media(max-width:620px){
  .tf-icon-sheet{top:max(48px,env(safe-area-inset-top))!important;bottom:max(98px,calc(74px + env(safe-area-inset-bottom)))!important}
  .tf-icon-catalog-body{padding-bottom:max(40px,env(safe-area-inset-bottom))!important}
}
</style>`;
  const cleanupScript=`<script id="tf-v100-cleanup">(function(){try{if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){try{var u=(r.active&&r.active.scriptURL)||(r.waiting&&r.waiting.scriptURL)||(r.installing&&r.installing.scriptURL)||'';if(u.indexOf('taskflow-sw.js')!==-1)r.unregister();}catch(_){}});}).catch(function(){});}if('caches' in window)caches.delete('taskflow-json-export-v1').catch(function(){});}catch(_){}})();<\/script>`;
  const scrollBridgeScript=`<script id="tf-v101-scroll-bridge">(function(){
    'use strict';
    if(window.__tfV101ScrollBridge)return;window.__tfV101ScrollBridge=true;
    var active=false,locked=false,startX=0,startY=0,lastY=0,lastT=0,velocity=0,owner=null,raf=0;
    function canScroll(el){return !!el&&el.scrollHeight>el.clientHeight+2;}
    function scrollOwner(target){
      if(!target)return document.scrollingElement||document.documentElement;
      var iconSheet=target.closest&&target.closest('.tf-icon-sheet');
      if(iconSheet){var iconBody=iconSheet.querySelector('.tf-icon-catalog-body');if(canScroll(iconBody))return iconBody;}
      var direct=target.closest&&target.closest('.rank-scroll-area,.v96-mentalist-scroll,.v97-routine-scroll,.policy-page.open,.side-menu.open,.window-container.open');
      if(direct&&canScroll(direct))return direct;
      return document.scrollingElement||document.documentElement;
    }
    function maxScroll(el){return Math.max(0,(el.scrollHeight||0)-(el.clientHeight||0));}
    function setScroll(el,value){var m=maxScroll(el);var v=Math.max(0,Math.min(m,value));if(el===document.scrollingElement||el===document.documentElement||el===document.body){window.scrollTo(0,v);}else{el.scrollTop=v;}return v;}
    function getScroll(el){if(el===document.scrollingElement||el===document.documentElement||el===document.body)return window.scrollY||document.documentElement.scrollTop||document.body.scrollTop||0;return el.scrollTop||0;}
    function stopInertia(){if(raf){cancelAnimationFrame(raf);raf=0;}}
    function inertia(){
      if(!owner||Math.abs(velocity)<0.08){raf=0;return;}
      var before=getScroll(owner),after=setScroll(owner,before+velocity*16);
      if(after===before){velocity=0;raf=0;return;}
      velocity*=0.92;raf=requestAnimationFrame(inertia);
    }
    document.addEventListener('touchstart',function(e){
      if(!e.touches||e.touches.length!==1)return;stopInertia();active=true;locked=false;owner=scrollOwner(e.target);startX=e.touches[0].clientX;startY=lastY=e.touches[0].clientY;lastT=performance.now();velocity=0;
    },{capture:true,passive:true});
    document.addEventListener('touchmove',function(e){
      if(!active||!owner||!e.touches||e.touches.length!==1)return;
      var x=e.touches[0].clientX,y=e.touches[0].clientY,dx=x-startX,dy=y-startY;
      if(!locked){if(Math.abs(dy)<6&&Math.abs(dx)<6)return;if(Math.abs(dx)>Math.abs(dy)*1.15){active=false;return;}locked=true;}
      var now=performance.now(),dt=Math.max(8,now-lastT),delta=lastY-y;lastY=y;lastT=now;
      var before=getScroll(owner),after=setScroll(owner,before+delta);velocity=(after-before)/dt;
      if(e.cancelable)e.preventDefault();
    },{capture:true,passive:false});
    function finish(){if(!active)return;active=false;if(locked&&owner&&Math.abs(velocity)>0.08){velocity*=18;raf=requestAnimationFrame(inertia);}else{owner=null;}}
    document.addEventListener('touchend',finish,{capture:true,passive:true});
    document.addEventListener('touchcancel',function(){active=false;locked=false;owner=null;stopInertia();},{capture:true,passive:true});
  })();<\/script>`;
  async function boot(){
    bootEl.classList.remove('error');retryEl.disabled=true;detailEl.textContent='';msgEl.textContent='Descargando TaskFlow…';
    try{
      const responses=await Promise.all(parts.map(async name=>{const response=await fetch(base+name,{cache:'no-store',mode:'cors'});if(!response.ok)throw new Error('No se pudo obtener '+name+' ('+response.status+')');return (await response.text()).trim();}));
      const payload=responses.join('');
      if(payload.length!==expectedLength)throw new Error('Paquete incompleto: '+payload.length+' / '+expectedLength);
      msgEl.textContent='Verificando integridad…';
      if(!globalThis.crypto?.subtle)throw new Error('SHA-256 no disponible en este navegador');
      const digest=hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(payload)));
      if(digest!==expectedHash)throw new Error('Integridad inválida: '+digest.slice(0,16));
      if(typeof DecompressionStream!=='function')throw new Error('DecompressionStream no disponible. Actualiza Chrome/Android System WebView.');
      const bin=atob(payload),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      let html=await new Response(stream).text();
      if(html.length<600000||!html.includes('<html')||!html.includes('TaskFlow'))throw new Error('Contenido reconstruido inválido');
      msgEl.textContent='Aplicando configuración…';
      html=html.replace(/<button\b[^>]*\bid=["']btnImportRoutineJSON["'][\s\S]*?<\/button>/i,'');
      html=html.replace(/<input\b[^>]*\bid=["']routineJsonImportInput["'][^>]*>/i,'');
      html=html.replace(/<button\b[^>]*\bid=["']btnExportRoutineJSON["'][\s\S]*?<\/button>/i,noAdsButton);
      html=html.replace(/function handleNoAdsAction\s*\([^)]*\)\s*\{[\s\S]*?\n\s*\}/,`function handleNoAdsAction(event){if(event&&typeof event.preventDefault==='function')event.preventDefault();window.location.href='http://action_noads';}`);
      html=html.replace(/if\(qaNoAds\)qaNoAds\.onclick=handleNoAdsAction;/,`if(qaNoAds)qaNoAds.onclick=handleNoAdsAction;`);
      html=html.replace(/http:\/\/action_search/g,'http://action_noads');
      if(html.includes('</head>'))html=html.replace('</head>',injectedStyle+cleanupScript+scrollBridgeScript+'</head>');
      document.open();document.write(html);document.close();
    }catch(error){
      console.error('TaskFlow boot error:',error);bootEl.classList.add('error');msgEl.textContent='No se pudo iniciar TaskFlow. Toca Reintentar.';detailEl.textContent=String(error&&error.message?error.message:error);retryEl.disabled=false;
    }
  }
  retryEl.addEventListener('click',boot);boot();
})();
</script>
</body>
</html>
